image: sbtscala/scala-sbt:eclipse-temurin-jammy-17.0.10_7_1.10.1_3.5.0

stages:
  - test

before_script:
  - sbt --version

test:
  stage: test
  script:
    - sbt clean coverage test coverageReport
  coverage: /Coverage was stmt=\[(\d*\.?\d*\%)\]/
  artifacts:
    when: always
    paths:
      - target/scala-*/scoverage-*
    reports:
      junit: target/test-reports/*.xml
